<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahorra Energía - Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Ahorra Energía</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="equipos.html">Equipos</a></li>
                    <li class="nav-item"><a class="nav-link" href="mi-factura.html">Mi Factura</a></li>
                    <li class="nav-item"><a class="nav-link" href="encuesta.html">Encuesta</a></li>
                    <li class="nav-item"><a class="nav-link active" href="registro.html">Registro</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm border-0 p-4">
                    <h1 class="h3 mb-3 text-primary text-center">Registro de Usuario</h1>
                    <p class="text-muted text-center mb-4">Regístrese en el sistema de monitoreo energético.</p>
                    
                    <form>
                        <div class="mb-3">
                            <label for="regNombre" class="form-label">Nombre Completo</label>
                            <input type="text" class="form-control" id="regNombre" required placeholder="Edwin Montoya">
                        </div>
                        <div class="mb-3">
                            <label for="regEmail" class="form-label">Correo Electrónico</label>
                            <input type="email" class="form-control" id="regEmail" required placeholder="tu@correo.com">
                        </div>
                        <div class="mb-3">
                            <label for="regPassword" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="regPassword" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Registrarse</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-5">
        <div class="container">
            <p class="mb-0">Desarrollado por Edwin Emilio Montoya Vasquez | Ingeniería Web 1</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
